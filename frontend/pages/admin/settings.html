<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-900 text-white p-6 overflow-y-auto">
      <div class="flex items-center gap-2 mb-8">
        <div class="bg-blue-600 p-2 rounded"><svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4z"></path><path fill-rule="evenodd" d="M3 10a1 1 0 011-1h12a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6z" clip-rule="evenodd"></path></svg></div>
        <span class="font-bold text-lg">InternLink</span>
      </div>
      <nav class="space-y-2 mb-8">
        <a href="dashboard.html" class="block px-4 py-2 hover:bg-gray-800 rounded">📊 Dashboard</a>
        <a href="opportunities.html" class="block px-4 py-2 hover:bg-gray-800 rounded">📁 Manage Opportunities</a>
        <a href="applications.html" class="block px-4 py-2 hover:bg-gray-800 rounded">📋 Applications</a>
        <a href="students.html" class="block px-4 py-2 hover:bg-gray-800 rounded">👥 Students</a>
        <a href="analytics.html" class="block px-4 py-2 hover:bg-gray-800 rounded">📈 Analytics</a>
        <a href="settings.html" class="block px-4 py-2 bg-blue-600 rounded-lg">⚙️ Settings</a>
      </nav>
      <div class="border-t border-gray-700 pt-4">
        <button onclick="logout()" class="w-full text-left px-4 py-2 hover:bg-gray-800 rounded">🚪 Sign Out</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-auto">
      <div class="bg-white border-b p-6">
        <h1 class="text-3xl font-bold mb-2">Settings</h1>
        <p class="text-gray-600">Manage platform configuration</p>
      </div>

      <div class="p-6">
        <div class="max-w-2xl">
          <div class="bg-white p-8 rounded-lg shadow">
            <h2 class="text-2xl font-bold mb-6">Platform Settings</h2>

            <form class="space-y-6">
              <div>
                <label class="block text-gray-700 font-medium mb-2">Platform Name</label>
                <input type="text" value="InternLink" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
              </div>

              <div>
                <label class="block text-gray-700 font-medium mb-2">Contact Email</label>
                <input type="email" value="support@internlink.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
              </div>

              <div>
                <label class="block text-gray-700 font-medium mb-2">Admin Email</label>
                <input type="email" value="admin@internlink.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
              </div>

              <div>
                <label class="block text-gray-700 font-medium mb-2">Max Applications per Student</label>
                <input type="number" value="10" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
              </div>

              <div>
                <label class="flex items-center gap-2 mb-2">
                  <input type="checkbox" checked class="w-4 h-4">
                  <span class="text-gray-700 font-medium">Allow Students to Edit Profile</span>
                </label>
              </div>

              <div>
                <label class="flex items-center gap-2 mb-2">
                  <input type="checkbox" checked class="w-4 h-4">
                  <span class="text-gray-700 font-medium">Send Email Notifications</span>
                </label>
              </div>

              <div class="flex gap-4 pt-4">
                <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Save Changes</button>
                <button type="button" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400">Cancel</button>
              </div>
            </form>

            <hr class="my-8">

            <h3 class="text-xl font-bold mb-4">Danger Zone</h3>
            <div class="bg-red-50 border border-red-200 p-4 rounded-lg">
              <p class="text-red-900 mb-4">Reset all platform data. This action cannot be undone.</p>
              <button class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">Reset Database</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('adminToken');
    if (!token) window.location.href = '/pages/admin-login.html';

    function logout() {
      localStorage.removeItem('adminToken');
      window.location.href = '/pages/admin-login.html';
    }
  </script>
</body>
</html>
