<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternLink • Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-md px-6 py-12">
    <div class="rounded-3xl bg-slate-900/95 p-8 shadow-2xl shadow-slate-950/40 ring-1 ring-slate-700">
      <a href="/" class="text-sm text-slate-400 hover:text-white">&larr; Back to home</a>
      <div class="mt-6">
        <p class="text-sky-300">InternLink</p>
        <h1 class="mt-4 text-3xl font-bold text-white">Sign in to your account</h1>
        <p class="mt-3 text-slate-400">Enter your credentials to access your dashboard.</p>
      </div>
      <form id="login-form" class="mt-8 space-y-5">
        <label class="block">
          <span class="text-sm text-slate-300">Email address</span>
          <input type="email" id="login-email" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-sky-400" placeholder="you@university.edu" required>
        </label>
        <label class="block">
          <span class="flex items-center justify-between text-sm text-slate-300">Password <a href="#" class="text-sky-400 hover:underline">Forgot password?</a></span>
          <input type="password" id="login-password" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-sky-400" placeholder="Enter your password" required>
        </label>
        <div class="flex items-center justify-between text-sm text-slate-300">
          <label class="flex items-center gap-2"><input type="checkbox" id="remember-me" class="h-4 w-4 rounded border-slate-600 bg-slate-800"> Remember me for 30 days</label>
          <button type="button" id="admin-login" class="text-sky-400 hover:underline">Sign in as Administrator</button>
        </div>
        <button type="submit" class="btn-primary w-full">Sign In →</button>
      </form>
      <p class="mt-6 text-center text-sm text-slate-400">Don't have an account? <a href="/pages/register.html" class="text-sky-300 hover:underline">Create one free</a></p>
      <p id="login-error" class="mt-3 text-center text-sm text-rose-400"></p>
    </div>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>
