<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal - InternLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white rounded-lg shadow-lg p-8">
      <div class="text-center mb-8">
        <div class="inline-block bg-blue-600 text-white p-4 rounded-lg mb-4">
          <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
            <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4z"></path>
            <path fill-rule="evenodd" d="M3 10a1 1 0 011-1h12a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6z" clip-rule="evenodd"></path>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 mb-2">Admin Portal</h1>
        <p class="text-gray-600">InternLink Administration Dashboard</p>
      </div>

      <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6">
        <p class="text-yellow-800 text-sm">⚠️ This portal is for authorized administrators only.</p>
      </div>

      <form id="adminLoginForm" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium mb-2">Admin Email</label>
          <input type="email" id="adminEmail" placeholder="admin@internlink.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" required>
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-2">Password</label>
          <input type="password" id="adminPassword" placeholder="Admin password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600" required>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">Sign In as Admin</button>
      </form>

      <div class="mt-6 text-center">
        <a href="login.html" class="text-blue-600 text-sm hover:underline">← Back to student login</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value;
      const password = document.getElementById('adminPassword').value;
      
      try {
        const response = await fetch('http://localhost:5000/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        if (response.ok) {
          localStorage.setItem('adminToken', data.token);
          localStorage.setItem('adminRole', data.role);
          window.location.href = '/pages/admin/dashboard.html';
        } else {
          alert('Invalid admin credentials');
        }
      } catch (error) {
        console.error('Login error:', error);
        alert('Login failed');
      }
    });
  </script>
</body>
</html>
