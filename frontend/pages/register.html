<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternLink • Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-lg px-6 py-12">
    <div class="rounded-3xl bg-slate-900/95 p-8 shadow-2xl shadow-slate-950/40 ring-1 ring-slate-700">
      <a href="/" class="text-sm text-slate-400 hover:text-white">&larr; Back to home</a>
      <div class="mt-6">
        <p class="text-sky-300">InternLink</p>
        <h1 class="mt-4 text-3xl font-bold text-white">Create your account</h1>
        <p class="mt-3 text-slate-400">Start your journey to a successful career.</p>
      </div>
      <div class="mt-8 flex items-center gap-3 text-sm text-slate-400">
        <div class="step-badge bg-slate-800 text-slate-100">1</div>
        <span>Account Info</span>
        <div class="h-px flex-1 bg-slate-800"></div>
        <div class="step-badge bg-slate-500 text-white">2</div>
        <span>Academic Info</span>
      </div>
      <form id="register-form" class="mt-8 space-y-6">
        <div id="step-1">
          <label class="block">
            <span class="text-sm text-slate-300">Full Name</span>
            <input type="text" id="register-name" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-sky-400" placeholder="Jane Doe" required>
          </label>
          <label class="block">
            <span class="text-sm text-slate-300">Email address</span>
            <input type="email" id="register-email" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-sky-400" placeholder="jane@university.edu" required>
          </label>
          <label class="block">
            <span class="text-sm text-slate-300">Password</span>
            <input type="password" id="register-password" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-sky-400" placeholder="Create a strong password" required>
          </label>
          <label class="block">
            <span class="text-sm text-slate-300">Confirm Password</span>
            <input type="password" id="register-confirm-password" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-sky-400" placeholder="Confirm your password" required>
          </label>
          <button type="button" id="continue-step" class="btn-primary w-full">Continue →</button>
        </div>
        <div id="step-2" class="hidden">
          <label class="block">
            <span class="text-sm text-slate-300">University / Institution</span>
            <input type="text" id="register-university" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-sky-400" placeholder="e.g. MIT, Stanford, UC Berkeley">
          </label>
          <label class="block">
            <span class="text-sm text-slate-300">Program of Study</span>
            <select id="register-program" class="mt-2 w-full rounded-2xl border border-slate-700 bg-slate-950 px-4 py-3 text-slate-100 outline-none focus:border-sky-400" required>
              <option value="">Select your program</option>
              <option>CS</option>
              <option>Engineering</option>
              <option>Business</option>
              <option>Data Science</option>
              <option>Design</option>
              <option>Other</option>
            </select>
          </label>
          <label class="flex items-start gap-3 text-sm text-slate-300">
            <input type="checkbox" id="register-terms" class="mt-1 h-4 w-4 rounded border-slate-600 bg-slate-800">
            <span>I agree to the Terms of Service and Privacy Policy.</span>
          </label>
          <div class="flex items-center gap-3">
            <button type="button" id="back-step" class="btn-secondary w-full">Back</button>
            <button type="submit" class="btn-primary w-full">Create Account →</button>
          </div>
        </div>
      </form>
      <p class="mt-6 text-center text-sm text-slate-400">Already have an account? <a href="/pages/login.html" class="text-sky-300 hover:underline">Sign in</a></p>
      <p id="register-error" class="mt-3 text-center text-sm text-rose-400"></p>
    </div>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>
