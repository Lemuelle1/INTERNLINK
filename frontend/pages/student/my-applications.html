<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternLink - My Applications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="../../css/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="sidebar w-64 flex-shrink-0 hidden md:flex flex-col text-white h-full transition-all duration-300">
        <div class="p-6 flex items-center space-x-3">
            <i class="fas fa-link text-indigo-400 text-2xl"></i>
            <span class="text-xl font-bold tracking-wider">InternLink</span>
        </div>
        
        <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto">
            <a href="dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
            <a href="profile.html" class="nav-link"><i class="fas fa-user"></i> My Profile</a>
            <a href="upload-cv.html" class="nav-link"><i class="fas fa-file-upload"></i> Upload CV</a>
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mt-6 mb-2 px-2">Discover</p>
            <a href="opportunities.html" class="nav-link"><i class="fas fa-briefcase"></i> Opportunities</a>
            <a href="scholarships.html" class="nav-link"><i class="fas fa-graduation-cap"></i> Scholarships</a>
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mt-6 mb-2 px-2">Manage</p>
            <a href="my-applications.html" class="nav-link active"><i class="fas fa-paper-plane"></i> My Applications</a>
            <a href="saved-jobs.html" class="nav-link"><i class="fas fa-bookmark"></i> Saved Jobs</a>
        </nav>
        
        <div class="p-4 border-t border-gray-700">
            <a href="settings.html" class="nav-link"><i class="fas fa-cog"></i> Settings</a>
            <a href="#" onclick="logout()" class="nav-link text-red-400 hover:text-red-300 hover:bg-red-900/20"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <header class="bg-white shadow-sm z-10 p-4 flex justify-between items-center">
            <h1 class="text-xl font-semibold text-gray-800">My Applications</h1>
            <div class="flex items-center space-x-4">
                <div class="h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-700 font-bold" id="userInitial">J</div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-6 md:p-8">
            <div class="max-w-7xl mx-auto space-y-6">
                
                <!-- Stats row -->
                <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                    <div class="glass-card p-4 rounded-xl text-center">
                        <div class="text-2xl font-bold text-gray-900" id="totalApp">0</div>
                        <div class="text-xs text-gray-500 uppercase tracking-wide font-semibold mt-1">Total Applied</div>
                    </div>
                    <div class="glass-card p-4 rounded-xl text-center">
                        <div class="text-2xl font-bold text-blue-600" id="reviewApp">0</div>
                        <div class="text-xs text-blue-500 uppercase tracking-wide font-semibold mt-1">Under Review</div>
                    </div>
                    <div class="glass-card p-4 rounded-xl text-center">
                        <div class="text-2xl font-bold text-green-600" id="acceptedApp">0</div>
                        <div class="text-xs text-green-500 uppercase tracking-wide font-semibold mt-1">Accepted</div>
                    </div>
                    <div class="glass-card p-4 rounded-xl text-center">
                        <div class="text-2xl font-bold text-yellow-600" id="pendingApp">0</div>
                        <div class="text-xs text-yellow-500 uppercase tracking-wide font-semibold mt-1">Pending</div>
                    </div>
                    <div class="glass-card p-4 rounded-xl text-center">
                        <div class="text-2xl font-bold text-red-600" id="rejectedApp">0</div>
                        <div class="text-xs text-red-500 uppercase tracking-wide font-semibold mt-1">Rejected</div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="border-b border-gray-200">
                    <nav class="-mb-px flex space-x-8">
                        <a href="#" class="border-indigo-500 text-indigo-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">All</a>
                        <a href="#" class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">Pending</a>
                        <a href="#" class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">Reviewed</a>
                        <a href="#" class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm">Accepted</a>
                    </nav>
                </div>

                <!-- Table -->
                <div class="bg-white shadow-sm rounded-xl overflow-hidden border border-gray-200">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Opportunity</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Applied Date</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th scope="col" class="relative px-6 py-3">
                                    <span class="sr-only">Actions</span>
                                </th>
                            </tr>
                        </thead>
                        <tbody id="applicationsTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </main>

    <script src="../../js/auth.js"></script>
    <script src="../../js/student.js"></script>
    <script src="../../js/applications.js"></script>
</body>
</html>
