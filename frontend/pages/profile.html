<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InternLink - My Profile</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Global Styling -->
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <!-- Global Navbar -->
  <div id="global-navbar"></div>

  <!-- Main App Content -->
  <main class="app-container py-5">
    <div class="container animate-fade-in">
      <div class="row g-4">
        
        <!-- Left: Summary Card -->
        <div class="col-lg-4">
          <div class="glass-card text-center mb-4">
            <div class="position-relative d-inline-block mb-3">
              <i class="bi bi-person-badge-fill text-primary" style="font-size: 80px; filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.3));"></i>
            </div>
            <h2 id="summary-name" class="h4 fw-bold mb-1">Loading...</h2>
            <p id="summary-email" class="text-muted text-sm mb-3">Loading...</p>
            <hr class="text-muted my-3">
            
            <div class="text-start">
              <h4 class="h6 fw-bold mb-2 text-uppercase text-muted" style="letter-spacing: 0.05em;">CV Upload Status</h4>
              <div id="cv-status-box" class="glass-card p-3 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                  <i id="cv-status-icon" class="bi bi-file-earmark-pdf text-danger fs-4"></i>
                  <div>
                    <p id="cv-status-title" class="mb-0 fw-semibold text-sm">No CV uploaded</p>
                    <p id="cv-status-size" class="mb-0 text-muted text-xs" style="font-size: 11px;">PDF, PNG or JPG max 10MB</p>
                  </div>
                </div>
                <a id="cv-download-link" href="#" target="_blank" class="btn-custom btn-custom-outline p-2 d-none" title="View CV">
                  <i class="bi bi-eye"></i>
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Right: Detail Form Card -->
        <div class="col-lg-8">
          <div class="glass-card">
            <h2 class="h3 fw-bold mb-4">Edit Profile</h2>
            
            <form id="profile-form">
              <!-- Name -->
              <div class="form-group-custom">
                <label class="form-label-custom" for="prof-name">Full Name</label>
                <input type="text" id="prof-name" class="form-input-custom" required>
              </div>

              <!-- Bio -->
              <div class="form-group-custom">
                <label class="form-label-custom" for="prof-bio">Short Bio</label>
                <textarea id="prof-bio" class="form-input-custom" rows="4" placeholder="Tell us about yourself, your goals, and interests..."></textarea>
              </div>

              <!-- Skills -->
              <div class="form-group-custom">
                <label class="form-label-custom" for="prof-skills">Skills (comma-separated)</label>
                <input type="text" id="prof-skills" class="form-input-custom" placeholder="e.g. JavaScript, Python, UI Design, AWS">
                <div id="skills-badges-preview" class="mt-2 d-flex flex-wrap gap-1"></div>
              </div>

              <!-- CV Upload Zone -->
              <div class="form-group-custom">
                <label class="form-label-custom">Upload CV / Resume</label>
                <div id="cv-upload-zone" class="upload-zone">
                  <i class="bi bi-cloud-arrow-up text-primary fs-1 mb-2"></i>
                  <p class="mb-1 fw-semibold text-sm">Drag and drop your CV file here</p>
                  <p class="text-muted text-xs mb-3" style="font-size: 12px;">or click to browse from files (PDF, PNG or JPG)</p>
                  <input type="file" id="cv-file-input" class="d-none" accept=".pdf,.jpg,.jpeg,.png">
                  <button type="button" id="browse-btn" class="btn-custom btn-custom-outline py-2 px-3">Browse Files</button>
                </div>
              </div>

              <!-- Submit button -->
              <button type="submit" class="btn-custom btn-custom-primary mt-3">
                <i class="bi bi-save"></i> Save Profile Details
              </button>
            </form>

          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center mt-auto">
    <div class="container">
      <p class="text-muted text-sm mb-0">&copy; 2026 InternLink. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Global Components -->
  <script type="module" src="/js/components/navbar.js"></script>

  <!-- Profile Script -->
  <script type="module">
    import { guardPage } from '/js/auth.js';
    import { updateProfile, uploadCV } from '/js/profile.js';
    import toast from '/js/components/toast.js';
    import loader from '/js/components/loader.js';

    let currentUser = null;

    // Load and fill profile fields
    const loadProfileData = async () => {
      loader.show();
      currentUser = await guardPage('student');
      if (!currentUser) return; // guardPage will redirect if not student

      document.getElementById('summary-name').innerText = currentUser.name;
      document.getElementById('summary-email').innerText = currentUser.email;
      document.getElementById('prof-name').value = currentUser.name;
      document.getElementById('prof-bio').value = currentUser.bio || '';
      
      const skillsStr = currentUser.skills ? currentUser.skills.join(', ') : '';
      document.getElementById('prof-skills').value = skillsStr;
      renderSkillsPreview(currentUser.skills || []);

      updateCVDisplay(currentUser.cvUrl);
      loader.hide();
    };

    const updateCVDisplay = (cvUrl) => {
      const icon = document.getElementById('cv-status-icon');
      const title = document.getElementById('cv-status-title');
      const downloadBtn = document.getElementById('cv-download-link');

      if (cvUrl) {
        icon.className = 'bi bi-file-earmark-pdf-fill text-success fs-3';
        title.innerText = 'CV uploaded';
        title.className = 'mb-0 fw-semibold text-sm text-success';
        downloadBtn.href = cvUrl;
        downloadBtn.classList.remove('d-none');
      } else {
        icon.className = 'bi bi-file-earmark-pdf text-muted fs-4';
        title.innerText = 'No CV uploaded';
        title.className = 'mb-0 fw-semibold text-sm';
        downloadBtn.classList.add('d-none');
      }
    };

    const renderSkillsPreview = (skills) => {
      const container = document.getElementById('skills-badges-preview');
      container.innerHTML = '';
      skills.forEach(skill => {
        if (!skill.trim()) return;
        const badge = document.createElement('span');
        badge.className = 'badge-custom badge-custom-internship text-capitalize';
        badge.innerHTML = `<i class="bi bi-tag-fill"></i> ${skill}`;
        container.appendChild(badge);
      });
    };

    // Live preview skills as user types
    document.getElementById('prof-skills').addEventListener('input', (e) => {
      const skills = e.target.value.split(',').map(s => s.trim()).filter(s => s.length > 0);
      renderSkillsPreview(skills);
    });

    // CV Upload Handling
    const uploadZone = document.getElementById('cv-upload-zone');
    const fileInput = document.getElementById('cv-file-input');
    const browseBtn = document.getElementById('browse-btn');

    browseBtn.addEventListener('click', () => fileInput.click());
    
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleCVUpload(e.target.files[0]);
      }
    });

    // Drag and Drop
    ['dragenter', 'dragover'].forEach(eventName => {
      uploadZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      uploadZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
      }, false);
    });

    uploadZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) {
        handleCVUpload(files[0]);
      }
    });

    const handleCVUpload = async (file) => {
      const validTypes = ['application/pdf', 'image/jpeg', 'image/png', 'image/jpg'];
      if (!validTypes.includes(file.type)) {
        toast.error('Invalid file type! Please upload a PDF, PNG or JPG.');
        return;
      }

      if (file.size > 10 * 1024 * 1024) { // 10MB limit
        toast.error('File is too large! Maximum limit is 10MB.');
        return;
      }

      const formData = new FormData();
      formData.append('cv', file);

      loader.show();
      try {
        const res = await uploadCV(formData);
        if (res.cvUrl) {
          toast.success('CV Uploaded and profile updated!');
          updateCVDisplay(res.cvUrl);
          // Update in-memory user
          currentUser.cvUrl = res.cvUrl;
        } else {
          toast.error(res.message || 'CV upload failed.');
        }
      } catch (err) {
        toast.error('Error uploading file to server.');
        console.error(err);
      } finally {
        loader.hide();
      }
    };

    // Save profile form details
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('prof-name').value.trim();
      const bio = document.getElementById('prof-bio').value.trim();
      const skills = document.getElementById('prof-skills').value;

      loader.show();
      try {
        const res = await updateProfile({ name, bio, skills });
        if (res.message) {
          toast.error(res.message);
        } else {
          toast.success('Profile updated successfully!');
          document.getElementById('summary-name').innerText = res.name;
          currentUser = res; // Sync
        }
      } catch (err) {
        toast.error('An error occurred while updating profile.');
        console.error(err);
      } finally {
        loader.hide();
      }
    });

    // Load data on load
    loadProfileData();
  </script>
</body>
</html>
